[project]
name = "resagent"
version = "0.1.0"
description = "ResAgent - AI-powered research agent pipeline"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "ResAgent Team" },
]
license = { text = "MIT" }

# Dependencies are specified in requirements.txt
# This section is kept minimal to avoid duplication.
dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-chroma>=0.2.0",
    "openai>=1.50.0",
    "tiktoken>=0.7.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.12",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
    "chromadb>=0.5.0",
    "PyMuPDF>=1.24.0",
    "python-docx>=1.1.0",
    "unstructured>=0.15.0",
    "jieba>=0.42.1",
    "torch>=2.4.0",
    "sentence-transformers>=3.1.0",
    "transformers>=4.45.0",
    "mcp>=1.0.0",
    "langsmith>=0.1.0",
    "opentelemetry-api>=1.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "tenacity>=9.0.0",
    "diskcache>=5.6.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pre-commit>=3.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["resagent"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = "tests"
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"
